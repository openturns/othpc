[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "othpc"
version = "0.1"
description = "Simplifies the evaluation of numerical simulation models on high performance computing facilities"
readme = "README.md"
dependencies = ["submitit>=1.5.4", "openturns", "tqdm", "pandas", "packaging"]
authors = [
  {name = "Elias Fekhari"},
  {name = "Joseph Muré"},
  {name = "Michaël Baudin"},
]
license = {text= "LGPL-3.0-or-later"}
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]

[tool.hatch.build.targets.wheel]
packages = ["othpc"]

[project.optional-dependencies]
doc = ["numpydoc", "sphinx-gallery", "sphinx"]
